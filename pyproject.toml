[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennisvision"
version = "0.1.0"
description = "Analyse post-traitement de vidéos de tennis : détection et suivi des joueurs et de la balle."
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.4",
    "torch>=2.15",
    "torchvision",
    "opencv-python>=5.0",
    "numpy>=2.0",
    "pandas>=3.0",
    "matplotlib>=3.10",
    "scikit-learn>=1.9",
    "lap>=0.5",
    "jsonschema>=4.23",
    "pyarrow>=18",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
tennisvision = "tennisvision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tennisvision = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
